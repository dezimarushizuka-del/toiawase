<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お問い合わせフォーム</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background: #007bff; color: white; padding: 10px 15px; border: none; cursor: pointer; width: 100%; }
    button:disabled { background: #ccc; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>お問い合わせフォーム</h2>
  
  <form id="contactForm">
    <div class="form-group">
      <label for="name">お名前</label>
      <input type="text" id="name" required>
    </div>
    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" required>
    </div>
    <div class="form-group">
      <label for="message">お問い合わせ内容</label>
      <textarea id="message" rows="5" required></textarea>
    </div>
    <button type="submit" id="submitBtn">送信する</button>
  </form>

  <div id="status"></div>

  <script>
    // ★ここにGASのデプロイURLを貼り付けます
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw1J_Rv7hrbaIgdXKPc_K91bFJUicsFibcBHs00pnR36WFrc_hSpGBB36NQNeoNaMYGiw/exec";

    document.getElementById("contactForm").addEventListener("submit", async (e) => {
      e.preventDefault(); // 画面リロードを防止

      const submitBtn = document.getElementById("submitBtn");
      const statusDiv = document.getElementById("status");

      // ボタンを無効化＆状態表示
      submitBtn.disabled = true;
      statusDiv.textContent = "送信中...";
      statusDiv.style.color = "black";

      // フォームデータの準備
      const formData = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
      };

      try {
        // GASへデータをPOST送信 (fetch API)
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (result.status === "success") {
          statusDiv.textContent = "お問い合わせを受け付けました。ありがとうございます！";
          statusDiv.style.color = "green";
          document.getElementById("contactForm").reset(); // フォーム消去
        } else {
          throw new Error(result.message);
        }
      } catch (error) {
        console.error(error);
        statusDiv.textContent = "送信に失敗しました。時間をおいて再度お試しください。";
        statusDiv.style.color = "red";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
